<text x="32" y="972" font-family="Inter,-apple-system,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12.5" fill="#8b98a9" text-anchor="start">Only Teleport's web port 3080 also listens on the Mac's home-network address, so the iPad can log in over Wi-Fi (LAN only, no router forwarding).</text>
<text x="32" y="992" font-family="Inter,-apple-system,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12.5" fill="#8b98a9" text-anchor="start">Auth, SSH proxy, tunnel and Splunk stay on 127.0.0.1. The SSH node, the web app and PostgreSQL publish no ports and are reached only through Teleport.</text>
<text x="32" y="1012" font-family="Inter,-apple-system,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">Teleport decides who gets in, Claude decides what it tries, Splunk records what happened.</text>
