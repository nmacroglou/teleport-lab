services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.11.2
    container_name: teleport
    hostname: localhost
    restart: unless-stopped
    environment:
      # Trust the local mkcert CA (public cert only) so the app service's
      # reverse tunnel to localhost:3080 verifies the proxy certificate.
      SSL_CERT_FILE: /etc/teleport-tls/mkcert-rootCA.pem
    volumes:
      - ./config:/etc/teleport:ro
      - ./secrets/tls:/etc/teleport-tls:ro
      - ./data:/var/lib/teleport
    ports:
      # Bound to 127.0.0.1 so the lab is only reachable from this Mac.
      - "127.0.0.1:3080:3080" # Web UI and API (proxy)
      - "127.0.0.1:3025:3025" # Auth service
      - "127.0.0.1:3023:3023" # SSH proxy
      - "127.0.0.1:3024:3024" # Reverse tunnel
    healthcheck:
      test: ["CMD", "/usr/local/bin/tctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  linux-server-1:
    build: ./node
    container_name: linux-server-1
    hostname: linux-server-1
    restart: unless-stopped
    depends_on:
      teleport:
        condition: service_healthy
    volumes:
      - ./node/teleport.yaml:/etc/teleport/teleport.yaml:ro
      - ./secrets/node-join-token:/etc/teleport-secrets/node-join-token:ro
      - ./node/data:/var/lib/teleport
    # No ports published: this server is only reachable through Teleport.

  whoami:
    image: traefik/whoami:v1.10.3
    container_name: whoami
    restart: unless-stopped
    # No ports published: this app is only reachable through Teleport.

  postgres:
    image: postgres:17.11
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /var/lib/postgresql/secrets/superuser-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Teleport-issued server cert/key and client CA (from tctl auth sign).
      - ./data/db-certs:/src/certs:ro
      - ./secrets/postgres-superuser-password:/src/superuser-password:ro
    # PostgreSQL refuses keys it doesn't own with strict permissions, which
    # Mac bind mounts can't provide, so copy them in before starting.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        install -d -o postgres -g postgres -m 700 /var/lib/postgresql/certs /var/lib/postgresql/secrets
        install -o postgres -g postgres -m 600 /src/certs/server.crt /src/certs/server.key /src/certs/server.cas /var/lib/postgresql/certs/
        install -o postgres -g postgres -m 600 /src/superuser-password /var/lib/postgresql/secrets/superuser-password
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/server.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/certs/server.cas
    # No ports published: this database is only reachable through Teleport.

  splunk:
    image: splunk/splunk:10.4.3
    # Splunk only ships Intel images; Docker Desktop runs it with Rosetta.
    platform: linux/amd64
    container_name: splunk
    hostname: splunk
    restart: unless-stopped
    environment:
      # Accepts the Splunk General Terms (approved by the lab owner).
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      # Skip the startup chown of /opt/splunk: it retries forever on the
      # read-only app mount. The first boot already set ownership.
      SPLUNK_HOME_OWNERSHIP_ENFORCEMENT: "false"
    # A recreated container brings back the image's first-run marker (ftr).
    # With an existing install Splunk then treats startup as an upgrade and
    # fails its AVX CPU check under Rosetta, looping forever. etc/passwd only
    # exists after a first successful start, so fresh installs are unaffected.
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -f /opt/splunk/etc/passwd ]; then sudo rm -f /opt/splunk/ftr; fi
        exec /sbin/entrypoint.sh "$$@"
      - --
    command: ["start-service"]
    # SPLUNK_PASSWORD (admin) lives in a git-ignored file.
    env_file:
      - ./secrets/splunk.env
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
      # Lab app: teleport index, audit input, token masking.
      - ./splunk/apps/teleport_lab:/opt/splunk/etc/apps/teleport_lab:ro
      # Teleport audit events only (not session recordings or keys).
      - ./data/log/e2043aaa-4782-4dbb-b4fa-15f6cd833dea:/teleport-audit:ro
    ports:
      # Bound to 127.0.0.1 so Splunk Web is only reachable from this Mac.
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  splunk-etc:
  splunk-var:
