# Index for Teleport audit events.
[teleport]
homePath   = $SPLUNK_DB/teleport/db
coldPath   = $SPLUNK_DB/teleport/colddb
thawedPath = $SPLUNK_DB/teleport/thaweddb
# Keep 90 days, at most 1 GB.
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 1024

# SYNTHETIC demo data (never mixed with the real index above).
[teleport_demo]
homePath   = $SPLUNK_DB/teleport_demo/db
coldPath   = $SPLUNK_DB/teleport_demo/colddb
thawedPath = $SPLUNK_DB/teleport_demo/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 256
