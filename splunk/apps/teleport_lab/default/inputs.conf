# Teleport's audit event folder, mounted read-only from ./data/log/<auth-id>.
# Only top-level *.log files: the sessions/ subfolder is not read.
[monitor:///teleport-audit/*.log]
index = teleport
sourcetype = teleport:audit
disabled = false

# SYNTHETIC demo events made by scripts/gen_demo_events.py (every event has demo=true).
[monitor:///teleport-demo/*.log]
index = teleport_demo
sourcetype = teleport:audit
disabled = false
