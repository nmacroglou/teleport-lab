# One JSON event per line.
[teleport:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%N
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 40
# Join token names act as secrets for token joins: mask before indexing.
SEDCMD-mask_token_name = s/"token_name":"[^"]*"/"token_name":"<redacted>"/g
